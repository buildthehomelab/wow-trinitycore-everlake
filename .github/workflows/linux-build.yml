name: Ubuntu x64

on:
  push:
    branches: [everlake]
  pull_request:
    branches: [everlake]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    # Everlake: for the sanitizer entries, which also run their binaries while building (test discovery) and in Check
    # executables; no effect on the others
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:suppressions=${{ github.workspace }}/.github/ubsan-suppressions.txt
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc-13
            cxx: g++-13
            pch: 1
            launcher: 
          - cc: clang-17
            cxx: clang++-17
            pch: 1
            launcher: 
          - cc: clang-17
            cxx: clang++-17
            pch: 0
            launcher: ccache
          # Everlake: the same build with AddressSanitizer, and again with UndefinedBehaviorSanitizer, without jemalloc;
          # the unit tests stop at the first error. Two builds, so a finding says which sanitizer saw it. (The bundled
          # protobuf trips UBSan's vptr check at start-up; dep/protobuf/CMakeLists.txt turns that one check off there.)
          # Keep the compiler in step with the entry above.
          - cc: clang-17
            cxx: clang++-17
            pch: 0
            launcher: ccache
            sanitize: address
          - cc: clang-17
            cxx: clang++-17
            pch: 0
            launcher: ccache
            sanitize: undefined
    steps:
    - uses: actions/checkout@v7
    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-start=$EPOCHSECONDS" >> "$GITHUB_OUTPUT"
        echo "build-output-dir=${{ github.workspace }}/bin" >> "$GITHUB_OUTPUT"
        echo "ccache-key-prefix=ubuntu-${{ matrix.cc }}${{ matrix.sanitize && format('-{0}', matrix.sanitize) || '' }}-${{ github.base_ref || github.ref_name }}" >> "$GITHUB_OUTPUT"
    - name: Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -yq ccache libboost-dev libboost-filesystem-dev libboost-locale-dev libboost-program-options-dev libboost-regex-dev libboost-thread-dev libssl-dev libreadline-dev zlib1g-dev libbz2-dev
    - name: Restore nopch cache
      id: ccache-restore
      if: ${{ matrix.pch == '0' }}
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ steps.strings.outputs.ccache-key-prefix }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.strings.outputs.ccache-key-prefix }}-${{ github.ref_name }}-
          ${{ steps.strings.outputs.ccache-key-prefix }}-
    - name: Setup
      env:
        CMAKE_BUILD_TYPE: Debug
        CMAKE_C_COMPILER_LAUNCHER: ${{ matrix.launcher }}
        CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.launcher }}
        CC: /usr/bin/${{ matrix.cc }}
        CXX: /usr/bin/${{ matrix.cxx }}
      run: >
        cmake -GNinja -S ${{ github.workspace }} -B ${{ steps.strings.outputs.build-output-dir }}
        -DWITH_WARNINGS=1 -DWITH_WARNINGS_AS_ERRORS=1 -DWITH_COREDEBUG=0 -DUSE_COREPCH=${{ matrix.pch }} -DUSE_SCRIPTPCH=${{ matrix.pch }} -DTOOLS=1 -DSCRIPTS=dynamic -DSERVERS=1 -DNOJEM=${{ matrix.sanitize && 1 || 0 }}
        -DCMAKE_C_FLAGS_DEBUG="-DNDEBUG -g0" -DCMAKE_CXX_FLAGS_DEBUG="-DNDEBUG -g0"
        -DCMAKE_INSTALL_PREFIX=check_install -DBUILD_TESTING=1
        -DASAN=${{ matrix.sanitize == 'address' && 1 || 0 }} -DUBSAN=${{ matrix.sanitize == 'undefined' && 1 || 0 }}
    - name: Build
      env:
        CCACHE_BASEDIR: ${{ github.workspace }}
        CCACHE_DIR: ${{ github.workspace }}/.ccache
        CCACHE_CPP2: 1
      run: |
        ccache -z
        cmake --build ${{ steps.strings.outputs.build-output-dir }} -- -k 0
        ccache -s
        ccache --evict-older-than $(($EPOCHSECONDS - ${{ steps.strings.outputs.build-start }}))s
    - name: Unit tests
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
      run: |
        cmake --build ${{ steps.strings.outputs.build-output-dir }} --target test
    - name: Check executables
      run: |
        cmake --install ${{ steps.strings.outputs.build-output-dir }}
        cd ${{ github.workspace }}/check_install/bin
        ./bnetserver --version
        ./worldserver --version
