[worldserver]
###################################################################################################
# WoW Forever Bots - realm settings (managed file)
# Shipped with every release and REPLACED by every update, so your server always plays like the main realm.
# Do not edit this file. Put your own changes in zz-9-local.conf (same folder, read last, never touched by updates).
# The size of the bot crowd (MaxBots, BotsPerPlayer, CityBots, ZoneBots, PoolMax, RssBudgetMb) is NOT here: it comes from
# the RAM preset in playerbot.conf (repack\make-tester-configs.ps1 -Preset small|medium|large).
###################################################################################################
###################################################################################################
# Core
###################################################################################################
Expansion = 0
# The 70707 client has no entry in auth.build_auth_key (the digest the world server checks), so without this every login is refused
# at the realm with 'Missing client build auth key' (client message WOW51900319). The main realm runs the same way.
Network.SkipBuildAuthKeyCheck = 1
MaxPlayerLevel = 60
Classic.Hardcore = 0
# advocaite's in-game Store: 0 (his default) leaves the Shop window on Loading, 1 sends the shop products.
Classic.Shop.Enabled = 1
# English client only (saves RAM: the locale strings are not loaded for the other 12 languages). A non-English client (data\dbc\ruRU and
# so on) gets Load.Locales = 1 from zz-2-client-language.conf, written by repack\ClientLanguage.ps1 on every start.
Load.Locales = 0
# Keep only fatal SQL errors on the console (a freshly converted vanilla world logs a lot at first start).
Logger.sql.sql = 6,Console DBErrors

###################################################################################################
# Raids and instances: not Blizzlike, the realm runs with these ON. Leave a line at 0 to keep that rule Blizzlike.
###################################################################################################
Instance.IgnoreRaid = 1
Instance.BindOnEntry = 1
Instance.PersistRaidTrash = 1
Instance.MoltenCoreSkipRunes = 1
Instance.IgnoreAttunement = 1
Instance.AhnQirajGatesOpen = 1
# Stock value: Molten Core core hound packs are not linked.
Instance.MoltenCoreHoundsLinked = 0

###################################################################################################
# Auction house bot: all three houses, vanilla items only, fair-price buying. One neutral house is used
# (AllowTwoSide.Interaction.Auction = 1 in worldserver.conf), so stock and buy there only.
###################################################################################################
AuctionHouseBot.Seller.Enabled = 1
AuctionHouseBot.Buyer.Enabled = 1
AuctionHouseBot.Buyer.Alliance.Enabled = 0
AuctionHouseBot.Buyer.Horde.Enabled = 0
AuctionHouseBot.Buyer.Neutral.Enabled = 1
AuctionHouseBot.Alliance.Items.Amount.Ratio = 0
AuctionHouseBot.Horde.Items.Amount.Ratio = 0
AuctionHouseBot.Neutral.Items.Amount.Ratio = 100
# Reserved account id for the seller characters (no real account; keep it below 2147483647).
AuctionHouseBot.Account = 2000000001
AuctionHouseBot.Sellers.Count = 12
AuctionHouseBot.Vanilla.Only = 1
AuctionHouseBot.Vanilla.MaxReqLevel = 60
AuctionHouseBot.Vanilla.MaxItemLevel = 100
AuctionHouseBot.Items.Amount.White = 3500
AuctionHouseBot.Items.Amount.Green = 3500
AuctionHouseBot.Items.Amount.Blue = 1200
AuctionHouseBot.Items.Amount.Purple = 250
# Prices from item level, quality and class (never below vendor price): a level 26 green ring about 1g, a green
# essence of item level 55 about 4.5g, a level 60 blue about 18g, a level 66 epic about 65g.
AuctionHouseBot.Vanilla.ValueCurve = 1
AuctionHouseBot.Items.Vendor = 1
# Also list what professions make (Lesser Magic Wand, crafted gear, potions); they are in no loot or vendor list.
AuctionHouseBot.Items.Crafted = 1
# ... and keep each of them listed at least once, so they are there even while the house is full.
AuctionHouseBot.Items.Crafted.MinStock = 1
AuctionHouseBot.Buyer.FairPricing = 1
AuctionHouseBot.Buyer.FairMinChance = 35
AuctionHouseBot.Buyer.Recheck.Interval = 5
AuctionHouseBot.Buyer.Commodities = 1
AuctionHouseBot.Buyer.MaxPriceMultiplier = 4.0
AuctionHouseBot.Buyer.MinDelay = 30
AuctionHouseBot.Buyer.MaxDelay = 600
AuctionHouseBot.Buyer.DailyBudgetGold = 5000
AuctionHouseBot.Buyer.MaxBuysPerHour = 200
# Class shares also follow how many different items each class has, so greens and blues are mostly gear.
AuctionHouseBot.Class.WeightByPoolSize = 1
AuctionHouseBot.Class.TradeGood = 10
AuctionHouseBot.Class.Consumable = 8
AuctionHouseBot.Class.Recipe = 3
AuctionHouseBot.Class.Container = 5
AuctionHouseBot.Class.Weapon = 6
AuctionHouseBot.Class.Armor = 6
AuctionHouseBot.Class.Reagent = 2
AuctionHouseBot.Class.Projectile = 3
AuctionHouseBot.Class.Misc = 2
AuctionHouseBot.Class.Quest = 0
AuctionHouseBot.Class.Key = 0
AuctionHouseBot.Class.Gem = 0
AuctionHouseBot.Class.Glyph = 0
AuctionHouseBot.Class.RandomStackRatio.Consumable = 50
AuctionHouseBot.Class.RandomStackRatio.TradeGood = 80
AuctionHouseBot.Update.Interval = 10
AuctionHouseBot.ItemsPerCycle.Normal = 100

###################################################################################################
# Logging (bot lines go to Playerbot.log, rewritten at each start; chat and whispers to Chat.log)
###################################################################################################
Appender.Console = 1,6,0
# The window stays quiet (fatal only) except for the loading progress and the "World initialized" line, which use their own console appender.
Appender.Loading = 1,3,0
Logger.server.loading = 3,Loading Server CrashRing
Logger.server.worldserver = 3,Loading Server CrashRing
Appender.Playerbot = 2,3,0,Playerbot.log,w
Appender.Chat = 2,2,1,Chat.log,a
Logger.playerbot.v2 = 3,Playerbot
Logger.playerbot.api = 3,Playerbot
Logger.ahbot = 3,Console Server
Logger.bg.battleground = 3,Console Server
Logger.instance.locks = 3,Console Server
Logger.network.opcode = 3,Console Server
Logger.chat.log = 2,Chat
Logger.chat.log.whisper = 2,Chat
PlayerSave.Stats.MinLevel = 1

###################################################################################################
# Bots
###################################################################################################
Playerbot.SharedDatabase = "playerbot"
Playerbot.Raid.Enable = 1
Playerbot.Housing.Enabled = 0
# Bot-founded guilds: bots found, recruit into and run their own guilds.
PlayerbotV2.Guilds.Enabled = 1
PlayerbotV2.SessionRhythm.Enabled = 0

# Cast speed, percent of normal cast time and GCD (GCD never under 750 ms): quicker in raids, slower in PvP.
# Off by default: vanilla cast speed. Set Playerbot.Cast.Enable = 1 to use the percentages below.
Playerbot.Cast.Enable = 0
Playerbot.Cast.RaidSpeedPct = 75
Playerbot.Cast.DungeonSpeedPct = 90
Playerbot.Cast.WorldSpeedPct = 100
Playerbot.Cast.BgSpeedPct = 115
Playerbot.Cast.WorldPvpSpeedPct = 115

# Raid companions: gear ceiling (0 pre-raid, 1 MC/Ony, 2 BWL, 2.5 AQ40, 3 Naxx), consumables provided, DPS wait for the owner's Attack
Playerbot.Gear.MaxTier = 2
Playerbot.Raid.ProvideConsumables = 1
Playerbot.Consumables.PvE = 1
Playerbot.Consumables.PvP = 0
Playerbot.Raid.DpsWaitTimeoutMs = 8000
# Grouped raid bots wear the vanilla pieces with the most resistance of the school the boss deals (fire in MC, etc.).
Playerbot.Raid.ResistGear = 1
# Bots only: level 58+ bots out in the world keep the flask or elixirs, scrolls, stat food and weapon stone of their role
# (as auras, nothing to buy). Raids already have them.
Playerbot.AlwaysBuffs.Consumables.World = 1
# Bots only: world buffs (Rallying Cry, Spirit of Zandalar, Songflower, Warchief's Blessing, Dire Maul) out in the world too.
# Raids already have them; battlegrounds stay without.
Playerbot.AlwaysBuffs.WorldBuffs.World = 1

# Battlegrounds: bots join only when a real player queues (queue fill and top-up), never on their own.
Playerbot.Bg.AutoSeed.Matches = 0
Playerbot.Bg.AutoJoin = 0
# Alterac Valley starts once 20 per side are queued (bots fill the rest up to 40 a side). 0 = the client table's value.
Playerbot.Bg.Av.MinPlayersPerTeam = 20

# World bots: how many (Bots.Reserve, Bots.ActiveCap, Bots.PerZone, Bots.InCity) is in your zz-9-local.conf, set by the
# launcher's Bots button (Low, Normal or High). The lines below are how they move about, not how many.
Playerbot.Population.TotalTarget = 0
Playerbot.Population.Floor = 0
Playerbot.Population.Ceiling = 0
Playerbot.Population.AutoScale = 0
Playerbot.World.Enable = 1
Playerbot.World.ActivityRadius = 600
Playerbot.World.SpawnRingMin = 150
Playerbot.World.SpawnRingMax = 350
Playerbot.World.TickMs = 500
Playerbot.World.SpawnPerTick = 8
Playerbot.World.CitySpawnPerTick = 20
Playerbot.World.WakeRadius = 450
Playerbot.World.FillerHubOnly = 1
Playerbot.World.GlobalFill = 0
Playerbot.World.TownPct = 100
# Start zones: at most 25 world bots (level 1-10, the zone's own races), at most 10 within 45 yards of one another. Leveling zones: Bots.PerZone.
Playerbot.World.StartZoneBots = 25
Playerbot.World.AreaCapStart = 10
# Out in a leveling zone: at most 8 world bots within 45 yards of one another (was 14), so a quest camp or a mob camp is not packed.
Playerbot.World.AreaCapOutdoors = 8
# In a town or capital: at most this many world bots within 45 yards of one another (bank, flight master, mailbox; was 40).
Playerbot.World.AreaCapTown = 20

# Bot paths (off up to 0.1.27.2; the dev realm already ran them on).
# RoadGraph: on long ground trips bots follow the road lines instead of a straight line across the country.
# HandcraftedRoads: paths prefer the road strips. SlopeCoefficient: paths avoid steep climbs (0.0 = off).
RoadGraph.Enable = 1
HandcraftedRoads.Enable = 1
Pathfinding.SlopeCoefficient = 1.0

# Faction balance: the sleeping roster is built 50% Horde per level bracket (it needs PoolMax room: the first start
# creates a few thousand characters, about two hours). Around a player the world bots are all of his own faction (100 in every
# *FriendlyPct key below): no hostile world bots by default. Lower the numbers (5..100) to let some of the other faction in.
Playerbot.World.SeedRoster = 1
Playerbot.World.SeedInFlight = 12
Playerbot.World.PoolHordePct = 50
Playerbot.World.ZoneMix = 1
Playerbot.World.FriendlyPct = 100
Playerbot.World.CapitalFriendlyPct = 100
Playerbot.World.HomeFriendlyPct = 100
Playerbot.World.BorderFriendlyPct = 100
Playerbot.World.ContestedFriendlyPct = 100

# Standard values of the settings that zz-9-local.conf (your own file) can change. They are here as well so that an install made
# before 0.1.29, whose zz-9-local.conf does not have them yet, starts without "Missing name" notes in Server.log. zz-9-local.conf wins.
Classic.Respawn.Level1to10Pct = 50
Classic.Respawn.Level11to20Pct = 70
Classic.Respawn.Level21to30Pct = 85
Classic.Respawn.Level31to60Pct = 100
Classic.CreatureHealth.RaiseFromLevel = 20
Classic.CreatureHealth.RaiseAt60Pct = 20
Classic.CreatureHealth.Raids = 0
Classic.AutoEquipNewBags = 0
AuctionHouseBot.Buyer.DropFloorPerLevel = 100