[worldserver]
###################################################################################################
# YOUR SERVER SETTINGS
# This is the only file you need to edit. It ships once with our standard values; after that it is
# yours: updates never change it, and anything here wins over our files. Change a number, save,
# restart the server (launcher: Stop, then Start). To go back to our standard, delete this file and
# the next update puts a fresh copy here.
###################################################################################################

# ---- Bots ---------------------------------------------------------------------------------------
# Reserve: bot characters kept ready, logged out, balanced by faction and level (costs disk, not memory).
# ActiveCap: most bots logged in at once, for everyone together (about 5 MB of memory each). Shared evenly over the zones with players.
# PerZone: bots in a levelling zone while you are in it; each zone picks a number in the range. InCity: bots in a capital.
# Bots log out 20 seconds after nobody is in their zone (Bots.LeaveZoneSec = 20), 60 seconds after you go into a dungeon,
# battleground or log out (Bots.LeaveWorldSec = 60).
#BOTS#
# Bots on or off. 1 = bots walk the world, and fill your dungeon finder groups and battlegrounds.
# 0 = no bots in the world, no bot fill. Bots you call yourself (.bot add, the bot panel) still come.
Playerbot.World.Enable = 1

# ---- Bot clothes ---------------------------------------------------------------------------------
# 1 = bots wear holiday items (Red and Green Winter Hats and the like) only while that holiday runs, 0 = never;
# out of season they take them off when they next log in.
Bots.HolidayClothes = 1

# ---- Bot chat ------------------------------------------------------------------------------------
# 1 = bots talk with a small local chat model (needs Ollama; the launcher's Bot chat button sets it up).
Playerbot.ChatModel.Enable = 0
Playerbot.ChatModel.Model = "llama3.2:3b"

# ---- Raids and dungeons --------------------------------------------------------------------------
# 1 = you can enter a raid without a raid group, so you can walk in and bring bots.
Instance.IgnoreRaid = 1
# 1 = no attunement quest or key needed to enter a raid (Onyxia, Molten Core, BWL...).
Instance.IgnoreAttunement = 1
# 1 = the Gates of Ahn'Qiraj are already open.
Instance.AhnQirajGatesOpen = 1
# 1 = no Aqual Quintessence (water) needed: the Molten Core runes count as put out, and Majordomo waits in his hall.
Instance.MoltenCoreSkipRunes = 1
# 1 = Ragnaros is already up in his lair, ready to fight (no Majordomo talk needed).
Instance.MoltenCoreRagnarosReady = 1
# 1 = you are saved to a raid when you walk in (vanilla rule).
Instance.BindOnEntry = 1
# 1 = raid trash you killed stays dead until the raid reset (it does not come back).
Instance.PersistRaidTrash = 1
# Raid bosses you killed stay dead until the raid reset. Reset day: 0 = Sunday, 1 = Monday, 2 = Tuesday ... 6 = Saturday.
# Reset hour: 0 to 23 (server clock).
ResetSchedule.WeekDay = 2
ResetSchedule.Hour = 8
# 1 = you can go into any dungeon or raid at any level (no level limit at the door).
Instance.IgnoreLevel = 0

# ---- Rates (1 = normal, 2 = double, 0.5 = half) ---------------------------------------------------
# Experience from kills, quests and exploring.
Rate.XP.Kill = 1
Rate.XP.Quest = 1
Rate.XP.Explore = 1
# Rested experience you build up while logged in (1 = normal).
Rate.Rest.InGame = 1
# Rested experience you build up while logged out in an inn or city / out in the world.
Rate.Rest.Offline.InTavernOrCity = 1
Rate.Rest.Offline.InWilderness = 1
# Gold that mobs drop.
Rate.Drop.Money = 1
# Reputation gained.
Rate.Reputation.Gain = 1
# Honor gained in PvP.
Rate.Honor = 1
# Talent points per level (1 = normal: one point a level from 10, 51 at 60; 2 = two a level, 102 at 60).
# Restart the server and log in again; lowering it below what you spent asks for a talent reset.
Rate.Talent = 1
# Crafting and gathering skill-ups per action.
SkillGain.Crafting = 1
SkillGain.Gathering = 1
# What repairs cost (1 = normal, 0 = free).
Rate.RepairCost = 1
# Auction house bot prices (1 = normal, close to old vanilla: a level 60 blue about 40g, a level 60 epic about 300-500g;
# 2 = double, 0.5 = half). The bots keep that price; after a change, old listings sell out or end within 3 days.
AuctionHouseBot.Vanilla.ValueCurve.Scale = 1

# ---- Travel --------------------------------------------------------------------------------------
# How fast you, your pets and the bots move (1 = normal, 2 = double). NPCs and mobs: Rate.MoveSpeed.Creature.
Rate.MoveSpeed = 1
Rate.MoveSpeed.Creature = 1
# 1 = every flight path is open to you from the start (no need to find each flight master first).
AllFlightPaths = 0
# 1 = flights take you there at once (no flying time).
InstantFlightPaths = 0

# ---- Guilds --------------------------------------------------------------------------------------
# Signatures a guild charter needs before you hand it in (0 to 4). 0 = you can make a guild on your own.
MinPetitionSigns = 4
# What a guild charter costs, in copper (1000 = 10 silver).
Guild.CharterCost = 1000
# 1 = bots may invite you to their guild when you are near them (you accept or say no). 0 = they never ask.
PlayerbotV2.Guilds.InvitePlayers = 0
# 1 = bots out in the world may invite you to their group when you walk past. 0 = they never ask
# (you can still invite a bot yourself, or whisper "invite" to it).
Playerbot.Behavior.InvitePassingPlayers = 0

# ---- What the bots get for free ------------------------------------------------------------------
# Bots never run out of food, water, ammo and reagents (open world / raids / battlegrounds).
Playerbot.AlwaysBuffs.Supplies.World = 1
Playerbot.AlwaysBuffs.Supplies.Raid = 1
Playerbot.AlwaysBuffs.Supplies.Battleground = 1
# Bots use flasks, elixirs, scrolls, food buffs and weapon stones (level 58+).
Playerbot.AlwaysBuffs.Consumables.World = 1
Playerbot.AlwaysBuffs.Consumables.Raid = 1
Playerbot.AlwaysBuffs.Consumables.Battleground = 0
# Bots get world buffs (Rallying Cry, Songflower, Zandalar...).
Playerbot.AlwaysBuffs.WorldBuffs.World = 1
Playerbot.AlwaysBuffs.WorldBuffs.Raid = 1
Playerbot.AlwaysBuffs.WorldBuffs.Battleground = 0
# Bots keep their gear repaired.
Playerbot.AlwaysBuffs.Repair.World = 1
Playerbot.AlwaysBuffs.Repair.Raid = 1
Playerbot.AlwaysBuffs.Repair.Battleground = 1
# Raid bots wear their fire/frost/nature/shadow resistance pieces when a boss needs it.
Playerbot.Raid.ResistGear = 1
# Raid bots wear an Onyxia Scale Cloak in Blackwing Lair (against Shadow Flame).
Playerbot.Raid.OnyxiaCloak = 1

# ---- Battlegrounds -------------------------------------------------------------------------------
# 1 = bots also queue for battlegrounds on their own, so matches run even when you are not queued.
# 0 = bots only join a battleground you queue for (they fill both sides so it starts).
Playerbot.Bg.AutoJoin = 0
# Alterac Valley waits for this many on each side (bots fill up) before it starts.
Playerbot.Bg.Av.MinPlayersPerTeam = 20

# ---- World (WoW Forever changes) ------------------------------------------------------------------
# How long mobs take to come back, in percent of the normal time, by mob level (100 = normal, 50 = twice as fast).
Classic.Respawn.Level1to10Pct = 50
Classic.Respawn.Level11to20Pct = 70
Classic.Respawn.Level21to30Pct = 85
Classic.Respawn.Level31to60Pct = 100
# Mobs above this level get more health, up to this many percent more at level 60 (0 = vanilla health).
Classic.CreatureHealth.RaiseFromLevel = 20
Classic.CreatureHealth.RaiseAt60Pct = 20
# 1 = raid mobs get the extra health too.
Classic.CreatureHealth.Raids = 0
# 1 = new bags go on by themselves (old way). 0 = you put new bags on by hand (WoW Forever).
Classic.AutoEquipNewBags = 0

# ---- Hired bots (NPC hire broker) -----------------------------------------------------------------
# Hired NPC bots only. Off by default (0): bots are free, made with the ForeverBots add-on or .bot add.
# Set 1 and nobody can make bots of their own (the add-on hides its "Add a bot" buttons, .bot add refuses):
# you hire bots for gold from a broker NPC - a Sellsword Captain at the inns, a Veteran Recruiter in
# the capitals, a Black Market Broker in Gadgetzan, Booty Bay and Ratchet. Quick party, Call saved and
# Raid ready bring the bots you hired. The Group finder and the dungeon finder still bring bots: they
# play with that group for free and go away when they leave it.
# 0 = off (free bots), 1 = on for everyone, 2 = each player picks (.bot hire on / .bot hire off).
# 0.1.30: hired NPC bots are off by default now. Set 1 to turn them back on.
Playerbot.Hire.Mode = 0
# 1 = GM accounts still make free bots while hired bots are on. 0 = the rule is for GMs too (on a
# realm of your own your account is a GM, so keep 0 to play with hired bots only).
Playerbot.Hire.GmBypass = 0
# What each broker gives: any of sellsword, veteran, legend (or none).
Playerbot.Hire.Inn.Sells = "sellsword"
Playerbot.Hire.Capital.Sells = "sellsword, veteran"
Playerbot.Hire.BlackMarket.Sells = "legend"
# Their gear: match (normal gear for the level), best (raid gear), bis (best in slot), t1, t2 or t3.
Playerbot.Hire.Sellsword.Gear = "match"
Playerbot.Hire.Veteran.Gear = "best"
Playerbot.Hire.Legend.Gear = "bis"
# Their health in percent: 100 = normal, 150 = half as much again, 200 = double.
Playerbot.Hire.Sellsword.HealthPct = 100
Playerbot.Hire.Veteran.HealthPct = 100
Playerbot.Hire.Legend.HealthPct = 100
# What they charge, in copper (10000 = 1 gold), at level 60: a full 5-man (4 bots) and a full 40-man (39 bots).
# One bot costs a quarter of the 5-man price (or 1/39 of the 40-man price in a raid). A Sellsword costs less below 60.
Playerbot.Hire.Sellsword.PartyPrice = 10000
Playerbot.Hire.Sellsword.RaidPrice = 200000
Playerbot.Hire.Veteran.PartyPrice = 30000
Playerbot.Hire.Veteran.RaidPrice = 600000
Playerbot.Hire.Legend.PartyPrice = 50000
Playerbot.Hire.Legend.RaidPrice = 1000000
# Daily wages: this percent of what you paid, once for each day you call the bot. 0 = no wages.
Playerbot.Hire.UpkeepPct = 25

# ---- Little things -------------------------------------------------------------------------------
# The opening film of a new character: 0 = always show it, 1 = only for your first character of a race, 2 = never.
SkipCinematics = 0

# ---- Your own settings ---------------------------------------------------------------------------
# Put anything else here. Each setting only once in this file.
